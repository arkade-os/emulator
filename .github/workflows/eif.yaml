name: EIF

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built EIFs to S3. Requires a tag ref.
        type: boolean
        default: false

# A pull request build is superseded by its next push. A tag build is not: it is
# the thing that produces a published measurement.
concurrency:
  group: eif-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every environment flake.nix exposes as eif-<name>.
  #
  # TODO: Try to pull these dynamically from flake?
  ENVIRONMENTS: dev se7enz

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A v-prefixed tag must agree with the version flake.nix bakes into the
      # binary, because that version is measured into PCR0. Any other tag is a
      # throwaway build tag with no version to agree with, so it is not checked.
      - name: Check tag matches flake version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          flake="$(nix eval --raw '.#emulator.version')"
          if [ "$tag" != "$flake" ]; then
            echo "::error::tag v${tag} does not match flake.nix version ${flake}"
            exit 1
          fi
          echo "tag v${tag} matches flake.nix"

      - name: Decide whether this run publishes
        id: gate
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Build EIFs
        run: |
          for env in $ENVIRONMENTS; do
            nix build ".#eif-${env}" --out-link "result-${env}"
          done

      # Use one directory per environment, avoid later steps using wrong environment.
      - name: Collect measurements
        run: |
          mkdir -p out/measurements
          {
            echo "## Enclave image measurements"
            echo
            echo "| env | PCR0 | sha256 |"
            echo "|---|---|---|"
          } > out/measurements/MEASUREMENTS.md

          for env in $ENVIRONMENTS; do
            mkdir -p "out/${env}"
            pcr0="$(jq -r .PCR0 "result-${env}/pcr.json")"

            install -m644 "result-${env}/image.eif" "out/${env}/emulator-${env}-${pcr0}.eif"
            install -m644 "result-${env}/pcr.json"  "out/${env}/emulator-${env}-${pcr0}.pcr.json"
            install -m644 "result-${env}/pcr.json"  "out/measurements/emulator-${env}-${pcr0}.pcr.json"

            # Glob only the payload, so the sums file cannot cover itself.
            (cd "out/${env}" && sha256sum emulator-* > SHA256SUMS)

            sha="$(sha256sum "out/${env}/emulator-${env}-${pcr0}.eif" | cut -d' ' -f1)"
            echo "| ${env} | \`${pcr0}\` | \`${sha}\` |" >> out/measurements/MEASUREMENTS.md
          done

          {
            echo
            echo "Published object name: \`emulator/<pcr0>.eif\`, alongside \`<pcr0>.pcr.json\`."
          } >> out/measurements/MEASUREMENTS.md

          cat out/measurements/MEASUREMENTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: measurements
          path: out/measurements/
          retention-days: 14

      - name: Upload dev EIF
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eif-dev
          path: out/dev/
          retention-days: 7

      - name: Upload se7enz EIF
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eif-se7enz
          path: out/se7enz/
          retention-days: 7

  publish-s3:
    name: publish-s3 (${{ matrix.env }})
    needs: build
    if: needs.build.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        include:
          # role_secret names the repository secret holding the role ARN. It is not
          # the ARN. GHA secrets are not allowed in the `strategy` configuration.
          - env: dev
            bucket: ark-dev-enclave-images
            region: eu-central-1
            role_secret: AWS_EIF_PUBLISH_ROLE_ARN_DEV

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eif-${{ matrix.env }}
          path: eif

      # The publish job trusts an artefact rather than rebuilding, which is worth
      # minutes on a runner with a cold /nix/store. The checksums are what make
      # that safe: the bytes are checked before credentials are even requested.
      - name: Verify checksums
        working-directory: eif
        run: sha256sum -c SHA256SUMS

      # An unset secret resolves to an empty string, and configure-aws-credentials
      # reports that as a malformed ARN. Validation.
      - name: Check the publish role is configured
        env:
          ROLE_ARN: ${{ secrets[matrix.role_secret] }}
          ROLE_SECRET: ${{ matrix.role_secret }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::repository secret ${ROLE_SECRET} is not set. Take the ARN from the ark-infra output github_actions_emulator_role_arn."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          aws-region: ${{ matrix.region }}

      - name: Publish to S3
        working-directory: eif
        env:
          BUCKET: ${{ matrix.bucket }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          pcr0="$(jq -r .PCR0 ./*.pcr.json)"
          eif="emulator-${ENV_NAME}-${pcr0}.eif"
          pcr="emulator-${ENV_NAME}-${pcr0}.pcr.json"
          sha="$(sha256sum "$eif" | cut -d' ' -f1)"

          # The object name is the measurement, so the same source always writes
          # the same name. Re-running is expected to be a no-op.
          #
          # The digest is carried as user metadata rather than read back from S3's
          # own checksum: `aws s3 cp` uploads 61 MB as multipart, so the native
          # checksum is a composite of part digests, not the digest of the file.
          existing="$(aws s3api head-object --bucket "$BUCKET" --key "emulator/${pcr0}.eif" \
            --query 'Metadata.sha256' --output text 2>/dev/null || true)"

          if [ -n "$existing" ] && [ "$existing" != "None" ]; then
            if [ "$existing" = "$sha" ]; then
              echo "emulator/${pcr0}.eif is already published with the same bytes; nothing to do"
              echo "already published: \`emulator/${pcr0}.eif\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::emulator/${pcr0}.eif exists with sha256 ${existing}, built ${sha}"
            exit 1
          fi

          aws s3 cp "$eif" "s3://${BUCKET}/emulator/${pcr0}.eif" --metadata "sha256=${sha}"
          aws s3 cp "$pcr" "s3://${BUCKET}/emulator/${pcr0}.pcr.json"

          # The three values modules/enclave/variables.tf refuses a slot without.
          {
            echo "## Published ${ENV_NAME}"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| eif_s3_uri | \`s3://${BUCKET}/emulator/${pcr0}.eif\` |"
            echo "| eif_pcr0 | \`${pcr0}\` |"
            echo "| eif_sha256 | \`${sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
