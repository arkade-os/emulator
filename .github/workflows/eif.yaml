name: EIF

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built EIFs to S3. Requires a tag ref.
        type: boolean
        default: false

# A pull request build is superseded by its next push. A tag build is not: it is
# the thing that produces a published measurement.
concurrency:
  group: eif-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # master branch.
    uses: ArkLabsHQ/enclave/.github/workflows/eif-build.yml@a2eb49e28bc3fd1c9aac88f98d4f490dd8ca93f2
    with:
      environments: '["mutinynet","se7enz"]'
      app_name: emulator
      version_flake_attr: emulator
      upload_images: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  # Any tag publishes.
  publish:
    name: publish (${{ matrix.environment }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - environment: mutinynet
            bucket: ark-dev-enclave-images
            region: eu-central-1
            role_secret: AWS_EIF_PUBLISH_ROLE_ARN_DEV
    # master branch.
    uses: ArkLabsHQ/enclave/.github/workflows/eif-publish.yml@a2eb49e28bc3fd1c9aac88f98d4f490dd8ca93f2
    with:
      environment: ${{ matrix.environment }}
      app_name: emulator
      bucket: ${{ matrix.bucket }}
      region: ${{ matrix.region }}
    secrets:
      role_arn: ${{ secrets[matrix.role_secret] }}
