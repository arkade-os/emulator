syntax = "proto3";

package emulator.v1;

import "meshapi/gateway/annotations.proto";

service EmulatorService {
  // GetInfo returns the Arkade signer's public key. The key is untweaked: tweak it with the
  // Arkade script hash before using it in a tapscript.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/info"
    };
  }

  // SubmitOffchainTx signs an Arkade transaction and its checkpoint transactions by executing
  // Arkade scripts on each input. The script runs only on the Arkade transaction, not on
  // checkpoints.
  rpc SubmitOffchainTx(SubmitOffchainTxRequest) returns (SubmitOffchainTxResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/offchain-tx"
      body: "*"
    };
  }

  // SubmitProof signs a BIP322 proof after validating its message and executing Arkade Script on
  // the proof transaction. The message may be any batch message type.
  rpc SubmitProof(SubmitProofRequest) returns (SubmitProofResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/proof"
      body: "*"
    };
  }

  // SubmitForfeitTxs signs forfeit transactions and boarding inputs on the commitment transaction.
  // It signs only when this Arkade signer's signature is in the BIP322 proof. The connector tree
  // verifies the forfeits belong to the batch. Call SubmitProof before registering the proof with
  // arkd, then SubmitForfeitTxs when the batch finalizes.
  rpc SubmitForfeitTxs(SubmitForfeitTxsRequest) returns (SubmitForfeitTxsResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/forfeit-txs"
      body: "*"
    };
  }

  // SubmitOnchainTx signs a Bitcoin transaction by executing Arkade scripts
  // on each input whose tapscript contains the emulator's tweaked key.
  rpc SubmitOnchainTx(SubmitOnchainTxRequest) returns (SubmitOnchainTxResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/onchain-tx"
      body: "*"
    };
  }
}

message GetInfoRequest {}
message GetInfoResponse {
  string version = 1;
  // hex-encoded compressed public key of the Arkade signer, untweaked.
  string arkade_signer_pubkey = 2;
  // hex-encoded compressed public keys of deprecated Arkade signers still accepted for signing.
  repeated string deprecated_arkade_signer_pubkeys = 3;
}

message SubmitOffchainTxRequest {
  // base64 psbt of the Arkade transaction.
  string arkade_tx = 1;
  // base64 psbts.
  repeated string checkpoint_txs = 2;
}
message SubmitOffchainTxResponse {
  string signed_arkade_tx = 1;
  repeated string signed_checkpoint_txs = 2;
}

message SubmitProofRequest {
  Bip322Proof bip322_proof = 1;
}
message SubmitProofResponse {
  // base64 psbt of the proof with this Arkade signer's signature.
  string signed_proof = 1;
}

message SubmitForfeitTxsRequest {
  Bip322Proof signed_bip322_proof = 1;
  repeated string forfeits = 2;
  repeated TxTreeNode connector_tree = 3;
  string commitment_tx = 4;
}
message SubmitForfeitTxsResponse {
  repeated string signed_forfeits = 1;
  string signed_commitment_tx = 2;
}

message TxTreeNode {
  string txid = 1;
  string tx = 2;
  map<uint32, string> children = 3;
}

// Bip322Proof is a BIP322 proof. proof is the base64 PSBT and message is the canonical message
// the proof signs.
message Bip322Proof {
  string proof = 1;
  string message = 2;
}

message SubmitOnchainTxRequest {
  // base64 psbt
  string tx = 1;
}
message SubmitOnchainTxResponse {
  string signed_tx = 1;
}
